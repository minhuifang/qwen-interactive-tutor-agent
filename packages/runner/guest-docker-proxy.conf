# Dedicated VM only. Explicit HTTP proxy caused intermittent TLS EOF.
# Do not change the macOS system proxy; use the VM's working network route.
[Service]
Environment="HTTP_PROXY=" "HTTPS_PROXY=" "ALL_PROXY=" "FTP_PROXY="
Environment="http_proxy=" "https_proxy=" "all_proxy=" "ftp_proxy="
Environment="NO_PROXY=*" "no_proxy=*"
